name: Build and Release

# ─────────────────────────────────────────────────────────────────────────────
# Two-stage pipeline.
#
#   1. verify   — Signing-free build proof. Runs with NO secrets on pull requests,
#                 manual dispatch, and as a required gate before any tagged
#                 release. Forks and secret-less runs can therefore still prove
#                 the app compiles. (The full build + unit tests + lint on every
#                 push lives in ci.yml; this job is release.yml's own guard so a
#                 tag can never reach the signing stage on top of a broken build.)
#
#   2. release  — Tag-triggered (v*). Signs with a Developer ID certificate,
#                 notarizes, staples, packages a DMG, and publishes a GitHub
#                 Release. `needs: verify` and gated to tag refs.
#
# Status of the three historical release blockers:
#       (a) deploy-target FORK — RESOLVED: Developer-ID DMG (Option B). This file
#           implements that path.
#       (b) signing config — RESOLVED: real bundle id (com.mousegestures.MouseGestures),
#           ENABLE_HARDENED_RUNTIME=YES (Release), an entitlements file, and a real
#           teamID (2RZ7SBH74J) in exportOptions.plist, all committed.
#       (c) repository secrets below — the ONLY remaining requirement. Once set,
#           pushing a v* tag produces a signed + notarized + stapled DMG.
#
# Required repository secrets for the `release` job (never commit real values):
#     SIGNING_CERTIFICATE_P12_BASE64  base64 of the Developer ID Application .p12
#     SIGNING_CERTIFICATE_PASSWORD    password protecting that .p12
#     KEYCHAIN_PASSWORD               throwaway password for the ephemeral keychain
#   Notarization — provide exactly ONE credential set:
#     (a) App Store Connect API key (recommended):
#         NOTARY_API_KEY_ID, NOTARY_API_ISSUER_ID, NOTARY_API_KEY_P8_BASE64
#     (b) Apple ID + app-specific password:
#         NOTARY_APPLE_ID, NOTARY_PASSWORD, NOTARY_TEAM_ID
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify build (unsigned, no secrets)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build (Release, unsigned)
        run: |
          xcodebuild build \
            -project "MouseGestures.xcodeproj" \
            -scheme MouseGestures \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            | xcbeautify || (echo "::error::Release build failed" && exit 1)

  release:
    name: Sign, notarize & publish DMG
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # ── Preflight: fail fast with a clear message if signing secrets are absent ──
      - name: Check release secrets are configured
        env:
          CERT_P12_BASE64: ${{ secrets.SIGNING_CERTIFICATE_P12_BASE64 }}
        run: |
          if [ -z "$CERT_P12_BASE64" ]; then
            echo "::error::Release secrets are not configured. This job cannot sign."
            echo "::error::See DEPLOYMENT.md § 'GitHub Actions secrets' for the full list."
            exit 1
          fi

      # ── Import the Developer ID certificate into an ephemeral keychain ──
      # Standard security(1) recipe; the keychain is thrown away with the runner.
      - name: Import signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.SIGNING_CERTIFICATE_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build and archive (signed, hardened runtime)
        run: |
          # Manual Developer ID signing with a secure timestamp. The runner has
          # only the imported Developer ID Application cert and no Xcode account,
          # so automatic signing cannot provision — sign explicitly. --timestamp
          # and the archive/export flow (next step) together strip get-task-allow
          # and add the secure timestamp that notarization requires.
          xcodebuild archive \
            -project "MouseGestures.xcodeproj" \
            -scheme MouseGestures \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/MouseGestures.xcarchive" \
            -destination 'generic/platform=macOS' \
            ENABLE_HARDENED_RUNTIME=YES \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM=2RZ7SBH74J \
            PROVISIONING_PROFILE_SPECIFIER="" \
            OTHER_CODE_SIGN_FLAGS="--timestamp" \
            | xcbeautify

      - name: Export app (Developer ID)
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/MouseGestures.xcarchive" \
            -exportOptionsPlist exportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            | xcbeautify

      - name: Create DMG
        run: |
          hdiutil create -volname "MouseGestures" \
            -srcfolder "$RUNNER_TEMP/export/MouseGestures.app" \
            -ov -format UDZO "$RUNNER_TEMP/MouseGestures.dmg"

      # ── Notarize the DMG with Apple and staple the ticket. ───────────────────
      # A Developer-ID DMG must be notarized + stapled or Gatekeeper refuses to
      # open it. notarytool accepts the .dmg directly. Provide exactly ONE
      # credential set (App Store Connect API key preferred; Apple ID fallback);
      # the step auto-selects whichever secrets are present and fails clearly if
      # neither is configured.
      - name: Notarize and staple
        env:
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
          NOTARY_API_KEY_P8_BASE64: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          set -euo pipefail
          DMG="$RUNNER_TEMP/MouseGestures.dmg"
          if [ -n "${NOTARY_API_KEY_P8_BASE64:-}" ]; then
            echo "==> Notarizing via App Store Connect API key…"
            echo "$NOTARY_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
            xcrun notarytool submit "$DMG" \
              --key "$RUNNER_TEMP/AuthKey.p8" \
              --key-id "$NOTARY_API_KEY_ID" \
              --issuer "$NOTARY_API_ISSUER_ID" \
              --wait
            rm -f "$RUNNER_TEMP/AuthKey.p8"
          elif [ -n "${NOTARY_APPLE_ID:-}" ]; then
            echo "==> Notarizing via Apple ID + app-specific password…"
            xcrun notarytool submit "$DMG" \
              --apple-id "$NOTARY_APPLE_ID" \
              --password "$NOTARY_PASSWORD" \
              --team-id "$NOTARY_TEAM_ID" \
              --wait
          else
            echo "::error::No notarization credentials configured. Set either the"
            echo "::error::App Store Connect API key (NOTARY_API_KEY_ID,"
            echo "::error::NOTARY_API_ISSUER_ID, NOTARY_API_KEY_P8_BASE64) or the"
            echo "::error::Apple ID set (NOTARY_APPLE_ID, NOTARY_PASSWORD, NOTARY_TEAM_ID)."
            exit 1
          fi
          echo "==> Stapling notarization ticket onto the DMG…"
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          echo "==> Gatekeeper assessment (must accept):"
          spctl --assess --type open --context context:primary-signature -v "$DMG"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/MouseGestures.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
