      <stop offset="0" stop-color="#131b30"/><stop offset="1" stop-color="#0a0e1a"/>
    </linearGradient>
    <radialGradient id="bSpark" cx="1" cy="1" r="1">
      <stop offset="0" stop-color="#4c8dff" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#4c8dff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#4c8dff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="bScreen"><rect x="20" y="24" width="88" height="72" rx="10"/></clipPath>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bBg)"/>
  <rect x="4.75" y="4.75" width="118.5" height="118.5" rx="27.4" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
