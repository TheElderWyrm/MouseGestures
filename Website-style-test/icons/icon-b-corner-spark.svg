    <circle cx="108" cy="96" r="46" fill="url(#bSpark)"/>
  </g>
  <rect x="20" y="24" width="88" height="72" rx="10" fill="none" stroke="rgba(237,241,247,0.55)" stroke-width="4"/>
  <path d="M48 42 L48 84 L58.5 74.5 L64.5 88.5 L71.5 85.5 L65.5 71.5 L79.5 70 Z" fill="#edf1f7" stroke="#0a0e1a" stroke-width="2.4" stroke-linejoin="round" transform="rotate(-14 60 64)"/>
  <path d="M40 108 h20 M66 108 h10" stroke="rgba(255,255,255,0.28)" stroke-width="4" stroke-linecap="round"/>
